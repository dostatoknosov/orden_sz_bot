}

  background: #293c2d;
  border-color: #8ca77d;
  color: #c8e0bc;
  cursor: pointer;
}

.day.available:active,
.day.opened:active {
  transform: scale(0.94);

.day:disabled {
  opacity: 0.65;
}

  // ПАМЯТЬ О ПОЛУЧЕННЫХ НАГРАДАХ

  const STORAGE_KEY = "orden_calendar_2026_opened";

  function getOpenedDays() {
    try {
      const saved = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
      );

      return Array.isArray(saved)
        ? saved.filter(day =>
            Number.isInteger(day) && day >= 1 && day <= 31
          )
        : [];
    } catch (error) {
      return [];
    }
  }

  let openedDays = getOpenedDays();

  function saveOpenedDays() {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(openedDays)
      );
    } catch (error) {
      console.warn("Не удалось сохранить награды", error);
    }
  }

  // ДАТА КАЛЕНДАРЯ

  function getCurrentDay() {
    const now = new Date();

    if (now.getFullYear() !== 2026) {
      return 0;
    }

    if (now.getMonth() < 11) {
      return 0;
    }

    if (now.getMonth() > 11) {
      return 31;
    }

    return now.getDate();
  }

  // СОЗДАНИЕ КАЛЕНДАРЯ

  const calendar = document.getElementById("calendar");
  const calendarNote = document.getElementById("calendarNote");
  const reward = document.getElementById("reward");

  function renderCalendar() {
    calendar.innerHTML = "";

    const currentDay = getCurrentDay();

    for (let i = 1; i <= 31; i++) {

      const button = document.createElement("button");

      button.type = "button";
      button.className = "day";
      button.textContent = i;

      const isOpened = openedDays.includes(i);
      const isToday = i === currentDay;

      if (isOpened) {
        button.classList.add("opened");
        button.setAttribute("aria-label", "День " + i + ", награда получена");
      } else if (isToday) {
        button.classList.add("available");
        button.setAttribute("aria-label", "Открыть награду дня " + i);
      } else {
        button.disabled = true;

        if (i < currentDay) {
          button.title = "Этот день пропущен";
        } else {
          button.title = "Этот день ещё не наступил";
        }
      }

      button.addEventListener("click", function() {

        if (!isOpened && !isToday) {
          return;
        }

        openReward(i);

      });

      calendar.appendChild(button);
    }

    if (currentDay === 0) {
      calendarNote.textContent =
        "Наступление начнётся 1 декабря 2026 года.";
    } else if (currentDay === 31) {
      calendarNote.textContent =
        "Наступление завершено. Твоя летопись ждёт тебя.";
    } else {
      calendarNote.textContent =
        "Сегодня открыт день № " + currentDay +
        ". Пропущенные дни остаются закрытыми.";
    }
  }

  // ОТКРЫТИЕ НАГРАДЫ

  function openReward(day) {

    const phrase = phrases[day];

    if (!phrase) {
      return;
    }

    const currentDay = getCurrentDay();
    const alreadyOpened = openedDays.includes(day);

    if (!alreadyOpened && day !== currentDay) {
      return;
    }

    if (!alreadyOpened) {
      openedDays.push(day);
      saveOpenedDays();
      renderCalendar();
    }

    document.getElementById("rewardTitle").textContent =
      "ИСТОРИЧЕСКОЕ ИЗРЕЧЕНИЕ № " + day;

    document.getElementById("rewardText").textContent =
      phrase.text;

    document.getElementById("rewardAuthor").textContent =
      "Автор: " + phrase.author;

    document.getElementById("rewardHistory").textContent =
      phrase.history;

    document.getElementById("rewardMeaning").textContent =
      phrase.meaning;

    document.getElementById("rewardYear").textContent =
      "Год: " + phrase.year;

    reward.style.display = "block";

    reward.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  }

  // ЗАКРЫТИЕ НАГРАДЫ

  document.getElementById("closeReward").addEventListener(
    "click",
    function() {
      reward.style.display = "none";
    }
  );

  // ЗАПУСК

  renderCalendar();

})();
</script>
